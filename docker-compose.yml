version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-crm-postgres
    restart: always
    environment:
      POSTGRES_DB: ai_crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    ports:
      - "5432:5432"
    volumes:
      - ai_crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d ai_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-crm-nextjs
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://crm_user:crm_password@postgres:5432/ai_crm?schema=public
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GROQ_CONTEXT_MODEL=${GROQ_CONTEXT_MODEL:-llama-3.3-70b-versatile}
      - AI_REQUEST_TIMEOUT_SECONDS=${AI_REQUEST_TIMEOUT_SECONDS:-12}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-replace-in-production-min-32-chars}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}

volumes:
  ai_crm_pgdata:
