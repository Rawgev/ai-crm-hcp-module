name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-test:
    name: Code Quality, Unit Tests & E2E Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password
          POSTGRES_DB: ai_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: postgresql://crm_user:crm_password@localhost:5432/ai_crm?schema=public
          DIRECT_URL: postgresql://crm_user:crm_password@localhost:5432/ai_crm?schema=public
        run: npx prisma migrate deploy

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Run Unit & Integration Tests (Vitest)
        env:
          DATABASE_URL: postgresql://crm_user:crm_password@localhost:5432/ai_crm?schema=public
          DIRECT_URL: postgresql://crm_user:crm_password@localhost:5432/ai_crm?schema=public
          JWT_SECRET: ci-pipeline-test-jwt-secret-min-32-chars-long
        run: npm test

      - name: Next.js Production Build
        env:
          DATABASE_URL: postgresql://crm_user:crm_password@localhost:5432/ai_crm?schema=public
          DIRECT_URL: postgresql://crm_user:crm_password@localhost:5432/ai_crm?schema=public
          JWT_SECRET: ci-pipeline-test-jwt-secret-min-32-chars-long
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Browser Tests
        env:
          DATABASE_URL: postgresql://crm_user:crm_password@localhost:5432/ai_crm?schema=public
          DIRECT_URL: postgresql://crm_user:crm_password@localhost:5432/ai_crm?schema=public
          JWT_SECRET: ci-pipeline-test-jwt-secret-min-32-chars-long
          PORT: 3000
        run: npx playwright test

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build:
    name: Production Docker Image Build
    runs-on: ubuntu-latest
    needs: quality-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ai-crm-hcp-module:latest

